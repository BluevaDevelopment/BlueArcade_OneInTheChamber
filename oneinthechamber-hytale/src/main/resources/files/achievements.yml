achievements:
  chamber_regular:
    name: "Chamber Regular"
    description:
      - "Play One In The Chamber matches."
    icon: Weapon_Sword_Wood
    phases:
      1:
        name: "First duel"
        description:
          - "Play 1 match."
        conditions:
          - "{bluearcade_stat_module_one_in_the_chamber_games_played} >= 1"
        rewards:
          commands:
            - "baa credits --action=give --target={player} --amount=10"
            - "baa xp --action=give --target={player} --amount=10"
          messages:
            - "  <gold>C</gold> <yellow>+10 credits</yellow>"
            - "  <purple>XP</purple> <light_purple>+10 XP</light_purple>"
